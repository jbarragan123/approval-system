version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: approval-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: approval-backend
    ports:
      - "3000:3000"
    environment:
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${DB_NAME}
      DB_PORT: ${DB_PORT}
      NODE_ENV: ${NODE_ENV}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: >
      sh -c "
        echo '⏳ Esperando que la base de datos esté lista...' &&
        sleep 10 &&
        echo '🚀 Ejecutando seeders...' &&
        npm run seed &&
        echo '✅ Iniciando servidor Express...' &&
        npm start
      "

  frontend:
    build: ./frontend
    container_name: approval-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  mysql-data:
