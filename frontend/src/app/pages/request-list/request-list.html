<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Solicitudes</h2>
    <button class="btn btn-primary" (click)="newRequest()">+ Nueva Solicitud</button>
  </div>

  <table class="table table-striped table-hover">
    <thead class="table-light">
      <tr>
        <th>ID</th>
        <th>Título</th>
        <th>Solicitante</th>
        <th>Responsable</th>
        <th>Tipo</th>
        <th>Estado</th>
        <th>Fecha</th>
        <th>Acción</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let req of requests">
        <td>{{ req.id }}</td>
        <td>{{ req.title }}</td>
        <td>{{ req.requester }}</td>
        <td>{{ req.approver }}</td>
        <td>{{ req.type }}</td>
        <td>
          <span class="badge" [ngClass]="{
            'bg-warning': req.status === 'PENDING',
            'bg-success': req.status === 'APPROVED',
            'bg-danger': req.status === 'REJECTED'
          }">{{ req.status }}</span>
        </td>
        <td>{{ req.createdAt | date:'short' }}</td>
        <td>
          <button class="btn btn-sm btn-outline-primary" (click)="goToDetail(req.id)">
            Ver
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
